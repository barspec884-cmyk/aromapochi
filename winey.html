<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WINEY — Aroma Pochi</title>
<style>
:root{--cat:#8f1f2d;--accent:#c7a97a;}
body{background:linear-gradient(to bottom,#fff4f4,#f9e6e7);font-family:'Helvetica Neue','Meiryo',sans-serif;color:#3a2e2e;margin:0;padding:max(10px,3vw);}
h1{text-align:center;margin:8px 0;color:#3a2e2e;}
p.sub{text-align:center;font-size:13px;color:#777;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding-bottom:80px;}
.btn{background:var(--cat);color:#fff;border:none;border-radius:14px;min-height:68px;font-size:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(0.95);box-shadow:0 0 8px rgba(0,0,0,.3) inset;}
.en{font-weight:700;font-size:14px;}
.jp{font-size:12px;opacity:.9;margin-top:2px;}
.bottom-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 22px;border-radius:28px;font-size:14px;text-decoration:none;}
</style>
</head>

<body>
<h1>WINEY（ワイニー）</h1>
<p class="sub">ワインや熟成酒のような香り — Winey Aroma Notes</p>

<div class="grid">
  <button class="btn" onclick="addStamp('winey','Raisin')"><span class="en">Raisin</span><span class="jp">レーズン</span></button>
  <button class="btn" onclick="addStamp('winey','Fig')"><span class="en">Fig</span><span class="jp">イチジク</span></button>
  <button class="btn" onclick="addStamp('winey','Sherry')"><span class="en">Sherry</span><span class="jp">シェリー</span></button>
  <button class="btn" onclick="addStamp('winey','Prune')"><span class="en">Prune</span><span class="jp">プルーン</span></button>
  <button class="btn" onclick="addStamp('winey','Port')"><span class="en">Port</span><span class="jp">ポート</span></button>
  <button class="btn" onclick="addStamp('winey','Rancio')"><span class="en">Rancio</span><span class="jp">ランシオ</span></button>
  <button class="btn" onclick="addStamp('winey','Oloroso')"><span class="en">Oloroso</span><span class="jp">オロロソ</span></button>
  <button class="btn" onclick="addStamp('winey','PX')"><span class="en">PX</span><span class="jp">PX</span></button>
  <button class="btn" onclick="addStamp('winey','Plum')"><span class="en">Plum</span><span class="jp">プラム</span></button>
  <button class="btn" onclick="addStamp('winey','Red Wine')"><span class="en">Red Wine</span><span class="jp">赤ワイン</span></button>
  <button class="btn" onclick="addStamp('winey','Walnut')"><span class="en">Walnut</span><span class="jp">クルミ</span></button>
  <button class="btn" onclick="addStamp('winey','Mocha')"><span class="en">Mocha</span><span class="jp">モカ</span></button>
  <button class="btn" onclick="addStamp('winey','Chocolate')"><span class="en">Chocolate</span><span class="jp">チョコレート</span></button>
  <button class="btn" onclick="addStamp('winey','Berry Jam')"><span class="en">Berry Jam</span><span class="jp">ベリージャム</span></button>
  <button class="btn" onclick="addStamp('winey','Input')"><span class="en">Input</span><span class="jp">インプット</span></button>
</div>

<a href="stamp.html" class="bottom-nav">← Aroma Stamp Board に戻る</a>

<script>
function addStamp(category, name){
  let data = JSON.parse(localStorage.getItem("aromaStamps") || "{}");
  if(!data[category]) data[category] = [];
  if(!data[category].includes(name)) data[category].push(name);
  localStorage.setItem("aromaStamps", JSON.stringify(data));
  const win = window.open("stamp.html", "aroma_stamp");
  if (win) win.focus();
  setTimeout(()=>{ window.close(); }, 500);
}
</script>
</body>
</html>
