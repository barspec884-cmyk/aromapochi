<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWEET — Aroma Pochi</title>
<style>
:root{--cat:#e3b75f;--accent:#c7a97a;}
body{background:linear-gradient(to bottom,#fffaf1,#f8edd7);font-family:'Helvetica Neue','Meiryo',sans-serif;color:#3a2e2e;margin:0;padding:max(10px,3vw);}
h1{text-align:center;margin:8px 0;color:#3a2e2e;}
p.sub{text-align:center;font-size:13px;color:#777;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding-bottom:80px;}
.btn{background:var(--cat);color:#fff;border:none;border-radius:14px;min-height:68px;font-size:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(0.95);box-shadow:0 0 8px rgba(0,0,0,.3) inset;}
.en{font-weight:700;font-size:14px;}
.jp{font-size:12px;opacity:.9;margin-top:2px;}
.bottom-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 22px;border-radius:28px;font-size:14px;text-decoration:none;}
</style>
</head>

<body>
<h1>SWEET（スイート）</h1>
<p class="sub">甘い香り — Sweet Aroma Notes</p>

<div class="grid">
  <button class="btn" onclick="addStamp('sweet','Honey')"><span class="en">Honey</span><span class="jp">ハチミツ</span></button>
  <button class="btn" onclick="addStamp('sweet','Vanilla')"><span class="en">Vanilla</span><span class="jp">バニラ</span></button>
  <button class="btn" onclick="addStamp('sweet','Caramel')"><span class="en">Caramel</span><span class="jp">キャラメル</span></button>
  <button class="btn" onclick="addStamp('sweet','Butterscotch')"><span class="en">Butterscotch</span><span class="jp">バタースコッチ</span></button>
  <button class="btn" onclick="addStamp('sweet','Toffee')"><span class="en">Toffee</span><span class="jp">トフィー</span></button>
  <button class="btn" onclick="addStamp('sweet','Chocolate')"><span class="en">Chocolate</span><span class="jp">チョコレート</span></button>
  <button class="btn" onclick="addStamp('sweet','Marzipan')"><span class="en">Marzipan</span><span class="jp">マジパン</span></button>
  <button class="btn" onclick="addStamp('sweet','Cream')"><span class="en">Cream</span><span class="jp">クリーム</span></button>
  <button class="btn" onclick="addStamp('sweet','Treacle')"><span class="en">Treacle</span><span class="jp">糖蜜</span></button>
  <button class="btn" onclick="addStamp('sweet','Maple syrup')"><span class="en">Maple syrup</span><span class="jp">メープルシロップ</span></button>
  <button class="btn" onclick="addStamp('sweet','Brown sugar')"><span class="en">Brown sugar</span><span class="jp">黒糖</span></button>
  <button class="btn" onclick="addStamp('sweet','Candy floss')"><span class="en">Candy floss</span><span class="jp">綿菓子</span></button>
  <button class="btn" onclick="addStamp('sweet','Syrup')"><span class="en">Syrup</span><span class="jp">シロップ</span></button>
  <button class="btn" onclick="addStamp('sweet','Molasses')"><span class="en">Molasses</span><span class="jp">モラセス</span></button>
  <button class="btn" onclick="addStamp('sweet','Input')"><span class="en">Input</span><span class="jp">インプット</span></button>
</div>

<a href="stamp.html" class="bottom-nav">← Aroma Stamp Board に戻る</a>

<script>
function addStamp(category, name){
  let data = JSON.parse(localStorage.getItem("aromaStamps") || "{}");
  if(!data[category]) data[category] = [];
  if(!data[category].includes(name)) data[category].push(name);
  localStorage.setItem("aromaStamps", JSON.stringify(data));
  const win = window.open("stamp.html", "aroma_stamp");
  if (win) win.focus();
  setTimeout(()=>{ window.close(); }, 500);
}
</script>
</body>
</html>
