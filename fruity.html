<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRUITY — Aroma Pochi</title>
<style>
:root{--cat:#e6a84a;--accent:#c7a97a;}
body{background:linear-gradient(to bottom,#fff8f0,#fbead1);font-family:'Helvetica Neue','Meiryo',sans-serif;color:#3a2e2e;margin:0;padding:max(10px,3vw);}
h1{text-align:center;margin:8px 0;color:#3a2e2e;}
p.sub{text-align:center;font-size:13px;color:#777;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding-bottom:80px;}
.btn{background:var(--cat);color:#fff;border:none;border-radius:14px;min-height:68px;font-size:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(0.95);box-shadow:0 0 8px rgba(0,0,0,.3) inset;}
.en{font-weight:700;font-size:14px;}
.jp{font-size:12px;opacity:.9;margin-top:2px;}
.bottom-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 22px;border-radius:28px;font-size:14px;text-decoration:none;}
</style>
</head>

<body>
<h1>FRUITY（フルーティー）</h1>
<p class="sub">果実を思わせる香り — Fruity Aroma Notes</p>

<div class="grid">
  <button class="btn" onclick="addStamp('fruity','Lemon')"><span class="en">Lemon</span><span class="jp">レモン</span></button>
  <button class="btn" onclick="addStamp('fruity','Orange')"><span class="en">Orange</span><span class="jp">オレンジ</span></button>
  <button class="btn" onclick="addStamp('fruity','Apple')"><span class="en">Apple</span><span class="jp">青リンゴ</span></button>
  <button class="btn" onclick="addStamp('fruity','Pear')"><span class="en">Pear</span><span class="jp">洋梨</span></button>
  <button class="btn" onclick="addStamp('fruity','Peach')"><span class="en">Peach</span><span class="jp">もも</span></button>
  <button class="btn" onclick="addStamp('fruity','Apricot')"><span class="en">Apricot</span><span class="jp">アプリコット</span></button>
  <button class="btn" onclick="addStamp('fruity','Cherry')"><span class="en">Cherry</span><span class="jp">チェリー</span></button>
  <button class="btn" onclick="addStamp('fruity','Grape')"><span class="en">Grape</span><span class="jp">ぶどう</span></button>
  <button class="btn" onclick="addStamp('fruity','Banana')"><span class="en">Banana</span><span class="jp">バナナ</span></button>
  <button class="btn" onclick="addStamp('fruity','Pineapple')"><span class="en">Pineapple</span><span class="jp">パイン</span></button>
  <button class="btn" onclick="addStamp('fruity','Mango')"><span class="en">Mango</span><span class="jp">マンゴー</span></button>
  <button class="btn" onclick="addStamp('fruity','Passionfruit')"><span class="en">Passionfruit</span><span class="jp">パッション</span></button>
  <button class="btn" onclick="addStamp('fruity','Dried Fruit')"><span class="en">Dried Fruit</span><span class="jp">ドライフルーツ</span></button>
  <button class="btn" onclick="addStamp('fruity','Citrus Peel')"><span class="en">Citrus Peel</span><span class="jp">柑橘ピール</span></button>
  <button class="btn" onclick="addStamp('fruity','Input')"><span class="en">Input</span><span class="jp">インプット</span></button>
</div>

<a href="stamp.html" class="bottom-nav">← Aroma Stamp Board に戻る</a>

<script>
function addStamp(category, name){
  let data = JSON.parse(localStorage.getItem("aromaStamps") || "{}");
  if(!data[category]) data[category] = [];
  if(!data[category].includes(name)) data[category].push(name);
  localStorage.setItem("aromaStamps", JSON.stringify(data));
  const win = window.open("stamp.html", "aroma_stamp");
  if (win) win.focus();
  setTimeout(()=>{ window.close(); }, 500);
}
</script>
</body>
</html>
