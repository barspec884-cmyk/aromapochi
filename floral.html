<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLORAL — Aroma Pochi</title>
<style>
:root{--cat:#d7a4d6;--accent:#c7a97a;}
body{background:linear-gradient(to bottom,#fff8f9,#f9eef4);font-family:'Helvetica Neue','Meiryo',sans-serif;color:#3a2e2e;margin:0;padding:max(10px,3vw);}
h1{text-align:center;margin:8px 0;color:#3a2e2e;}
p.sub{text-align:center;font-size:13px;color:#777;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding-bottom:80px;}
.btn{background:var(--cat);color:#fff;border:none;border-radius:14px;min-height:68px;font-size:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(0.95);box-shadow:0 0 8px rgba(0,0,0,.3) inset;}
.en{font-weight:700;font-size:14px;}
.jp{font-size:12px;opacity:.9;margin-top:2px;}
.bottom-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 22px;border-radius:28px;font-size:14px;text-decoration:none;}
</style>
</head>

<body>
<h1>FLORAL（フローラル）</h1>
<p class="sub">花などの芳香を感じる華やかな香り — Floral Aroma Notes</p>

<div class="grid">
  <button class="btn" onclick="addStamp('floral','Lavender')"><span class="en">Lavender</span><span class="jp">ラベンダー</span></button>
  <button class="btn" onclick="addStamp('floral','Rose')"><span class="en">Rose</span><span class="jp">ローズ</span></button>
  <button class="btn" onclick="addStamp('floral','Violet')"><span class="en">Violet</span><span class="jp">スミレ</span></button>
  <button class="btn" onclick="addStamp('floral','Orange blossom')"><span class="en">Orange blossom</span><span class="jp">オレンジの花</span></button>
  <button class="btn" onclick="addStamp('floral','Jasmine')"><span class="en">Jasmine</span><span class="jp">ジャスミン</span></button>
  <button class="btn" onclick="addStamp('floral','Chamomile')"><span class="en">Chamomile</span><span class="jp">カモミール</span></button>
  <button class="btn" onclick="addStamp('floral','Honeysuckle')"><span class="en">Honeysuckle</span><span class="jp">ハニーサックル</span></button>
  <button class="btn" onclick="addStamp('floral','Lilac')"><span class="en">Lilac</span><span class="jp">ライラック</span></button>
  <button class="btn" onclick="addStamp('floral','Geranium')"><span class="en">Geranium</span><span class="jp">ゼラニウム</span></button>
  <button class="btn" onclick="addStamp('floral','Peony')"><span class="en">Peony</span><span class="jp">ボタン</span></button>
  <button class="btn" onclick="addStamp('floral','Osmanthus')"><span class="en">Osmanthus</span><span class="jp">キンモクセイ</span></button>
  <button class="btn" onclick="addStamp('floral','Mimosa')"><span class="en">Mimosa</span><span class="jp">ミモザ</span></button>
  <button class="btn" onclick="addStamp('floral','Lily')"><span class="en">Lily</span><span class="jp">ユリ</span></button>
  <button class="btn" onclick="addStamp('floral','Magnolia')"><span class="en">Magnolia</span><span class="jp">モクレン</span></button>
  <button class="btn" onclick="addStamp('floral','Input')"><span class="en">Input</span><span class="jp">インプット</span></button>
</div>

<a href="stamp.html" class="bottom-nav">← Aroma Stamp Board に戻る</a>

<script>
function addStamp(category, name){
  let data = JSON.parse(localStorage.getItem("aromaStamps") || "{}");
  if(!data[category]) data[category] = [];
  if(!data[category].includes(name)) data[category].push(name);
  localStorage.setItem("aromaStamps", JSON.stringify(data));
  const win = window.open("stamp.html", "aroma_stamp");
  if (win) win.focus();
  setTimeout(()=>{ window.close(); }, 500);
}
</script>
</body>
</html>
