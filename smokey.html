<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMOKEY — Aroma Pochi</title>
<style>
:root{--cat:#495057;--accent:#c7a97a;}
body{background:linear-gradient(to bottom,#f6f6f6,#e8e8e8);font-family:'Helvetica Neue','Meiryo',sans-serif;color:#2e2e2e;margin:0;padding:max(10px,3vw);}
h1{text-align:center;margin:8px 0;color:#2e2e2e;}
p.sub{text-align:center;font-size:13px;color:#777;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding-bottom:80px;}
.btn{background:var(--cat);color:#fff;border:none;border-radius:14px;min-height:68px;font-size:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(0.95);box-shadow:0 0 8px rgba(0,0,0,.3) inset;}
.en{font-weight:700;font-size:14px;}
.jp{font-size:12px;opacity:.9;margin-top:2px;}
.bottom-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 22px;border-radius:28px;font-size:14px;text-decoration:none;}
</style>
</head>

<body>
<h1>SMOKEY（スモーキー）</h1>
<p class="sub">ピートや煙を感じる香り — Peaty / Smoky Aroma Notes</p>

<div class="grid">
  <button class="btn" onclick="addStamp('smokey','Mud')"><span class="en">Mud</span><span class="jp">泥</span></button>
  <button class="btn" onclick="addStamp('smokey','Seaweed')"><span class="en">Seaweed</span><span class="jp">海藻</span></button>
  <button class="btn" onclick="addStamp('smokey','Rocky shore')"><span class="en">Rocky shore</span><span class="jp">磯</span></button>
  <button class="btn" onclick="addStamp('smokey','Fish')"><span class="en">Fish</span><span class="jp">魚</span></button>
  <button class="btn" onclick="addStamp('smokey','Bonfire')"><span class="en">Bonfire</span><span class="jp">焚き火</span></button>
  <button class="btn" onclick="addStamp('smokey','Peat')"><span class="en">Peat</span><span class="jp">ピート</span></button>
  <button class="btn" onclick="addStamp('smokey','Seirogan')"><span class="en">Seirogan</span><span class="jp">正露丸</span></button>
  <button class="btn" onclick="addStamp('smokey','Tar')"><span class="en">Tar</span><span class="jp">タール</span></button>
  <button class="btn" onclick="addStamp('smokey','Tree moss')"><span class="en">Tree moss</span><span class="jp">苔</span></button>
  <button class="btn" onclick="addStamp('smokey','Peat smoke')"><span class="en">Peat smoke</span><span class="jp">ピートスモーク</span></button>
  <button class="btn" onclick="addStamp('smokey','Smoke')"><span class="en">Smoke</span><span class="jp">スモーク</span></button>
  <button class="btn" onclick="addStamp('smokey','Disinfectant')"><span class="en">Disinfectant</span><span class="jp">消毒液</span></button>
  <button class="btn" onclick="addStamp('smokey','Tincture of iodine')"><span class="en">Tincture of iodine</span><span class="jp">ヨードチンキ</span></button>
  <button class="btn" onclick="addStamp('smokey','Creosote')"><span class="en">Creosote</span><span class="jp">クレオソート</span></button>
  <button class="btn" onclick="addStamp('smokey','Input')"><span class="en">Input</span><span class="jp">インプット</span></button>
</div>

<a href="stamp.html" class="bottom-nav">← Aroma Stamp Board に戻る</a>

<script>
function addStamp(category, name){
  let data = JSON.parse(localStorage.getItem("aromaStamps") || "{}");
  if(!data[category]) data[category] = [];
  if(!data[category].includes(name)) data[category].push(name);
  localStorage.setItem("aromaStamps", JSON.stringify(data));
  const win = window.open("stamp.html", "aroma_stamp");
  if (win) win.focus();
  setTimeout(()=>{ window.close(); }, 500);
}
</script>
</body>
</html>
