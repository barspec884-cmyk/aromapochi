<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEREAL — Aroma Pochi</title>
<style>
:root{--cat:#c9a86a;--accent:#c7a97a;}
body{background:linear-gradient(to bottom,#fff8ed,#f9eccc);font-family:'Helvetica Neue','Meiryo',sans-serif;color:#3a2e2e;margin:0;padding:max(10px,3vw);}
h1{text-align:center;margin:8px 0;color:#3a2e2e;}
p.sub{text-align:center;font-size:13px;color:#777;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding-bottom:80px;}
.btn{background:var(--cat);color:#fff;border:none;border-radius:14px;min-height:68px;font-size:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(0.95);box-shadow:0 0 8px rgba(0,0,0,.3) inset;}
.en{font-weight:700;font-size:14px;}
.jp{font-size:12px;opacity:.9;margin-top:2px;}
.bottom-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 22px;border-radius:28px;font-size:14px;text-decoration:none;}
</style>
</head>

<body>
<h1>CEREAL（シリアル）</h1>
<p class="sub">穀物を思わせる香り — Cereal Aroma Notes</p>

<div class="grid">
  <button class="btn" onclick="addStamp('cereal','Malt')"><span class="en">Malt</span><span class="jp">モルト</span></button>
  <button class="btn" onclick="addStamp('cereal','Wheat')"><span class="en">Wheat</span><span class="jp">小麦</span></button>
  <button class="btn" onclick="addStamp('cereal','Corn')"><span class="en">Corn</span><span class="jp">トウモロコシ</span></button>
  <button class="btn" onclick="addStamp('cereal','Rye')"><span class="en">Rye</span><span class="jp">ライ麦</span></button>
  <button class="btn" onclick="addStamp('cereal','Oatmeal')"><span class="en">Oatmeal</span><span class="jp">オートミール</span></button>
  <button class="btn" onclick="addStamp('cereal','Biscuit')"><span class="en">Biscuit</span><span class="jp">ビスケット</span></button>
  <button class="btn" onclick="addStamp('cereal','Bread')"><span class="en">Bread</span><span class="jp">パン</span></button>
  <button class="btn" onclick="addStamp('cereal','Toast')"><span class="en">Toast</span><span class="jp">トースト</span></button>
  <button class="btn" onclick="addStamp('cereal','Sweet malt')"><span class="en">Sweet malt</span><span class="jp">甘モルト</span></button>
  <button class="btn" onclick="addStamp('cereal','Raw grain')"><span class="en">Raw grain</span><span class="jp">生穀物</span></button>
  <button class="btn" onclick="addStamp('cereal','Yeast')"><span class="en">Yeast</span><span class="jp">酵母</span></button>
  <button class="btn" onclick="addStamp('cereal','Powdery')"><span class="en">Powdery</span><span class="jp">粉っぽい</span></button>
  <button class="btn" onclick="addStamp('cereal','Grain dust')"><span class="en">Grain dust</span><span class="jp">穀粉</span></button>
  <button class="btn" onclick="addStamp('cereal','Cereal mash')"><span class="en">Cereal mash</span><span class="jp">マッシュ</span></button>
  <button class="btn" onclick="addStamp('cereal','Input')"><span class="en">Input</span><span class="jp">インプット</span></button>
</div>

<a href="stamp.html" class="bottom-nav">← Aroma Stamp Board に戻る</a>

<script>
function addStamp(category, name){
  let data = JSON.parse(localStorage.getItem("aromaStamps") || "{}");
  if(!data[category]) data[category] = [];
  if(!data[category].includes(name)) data[category].push(name);
  localStorage.setItem("aromaStamps", JSON.stringify(data));
  const win = window.open("stamp.html", "aroma_stamp");
  if (win) win.focus();
  setTimeout(()=>{ window.close(); }, 500);
}
</script>
</body>
</html>
