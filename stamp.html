<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aroma Stamps — Amber Palette</title>
<style>
:root{
  --bg1:#f8f5ef;
  --bg2:#efe6d8;
  --ink:#3a2e2e;
  --accent:#c7a97a;

  /* 各カテゴリカラー */
  --c-fruity:#ff7926;
  --c-floral:#ff8bb2;
  --c-sweet:#f6b84b;
  --c-winey:#b46dd6;
  --c-woody:#b97a56;
  --c-smokey:#6b4b32;
  --c-sulfury:#caa974;
  --c-cereal:#e8c94c;
}

body{
  background:linear-gradient(to bottom,var(--bg1),var(--bg2));
  font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  color:var(--ink);
  margin:0;
  padding:12px;
}

/* タイトル */
h1{
  text-align:center;
  font-size:clamp(18px,5vw,22px);
  margin:10px 0;
  color:var(--accent);
}

/* 各カテゴリブロック */
.block{
  margin:14px 0;
  background:#fffaf2;
  border-radius:16px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
  padding:10px 12px 14px;
}
.block h2{
  font-size:16px;
  margin:0 0 8px;
  display:flex;
  align-items:center;
  gap:8px;
}
h2 span{
  width:16px;
  height:16px;
  border-radius:50%;
  display:inline-block;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.tag{
  background:var(--accent);
  color:#fff;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
  cursor:pointer;
  transition:opacity .2s;
}
.tag:hover{opacity:.8;}

/* フッターボタン */
.footer{
  text-align:center;
  margin-top:20px;
}
button.clear{
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:24px;
  padding:10px 20px;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}
button.clear:active{opacity:.8;}

@media (prefers-color-scheme: dark){
  body{background:radial-gradient(800px at 50% 10%,#1b1917,#0f0e0d);color:#f6efe6;}
  .block{background:#27231f;}
}
</style>
</head>

<body>
<h1>My Aroma Stamps</h1>

<div id="container"></div>

<div class="footer">
  <button class="clear" onclick="clearAll()">全て消す</button>
</div>

<script>
/* カテゴリと表示設定 */
const categories = [
  {key:'fruity',  label:'Fruity',  color:'var(--c-fruity)'},
  {key:'floral',  label:'Floral',  color:'var(--c-floral)'},
  {key:'sweet',   label:'Sweet',   color:'var(--c-sweet)'},
  {key:'winey',   label:'Winey',   color:'var(--c-winey)'},
  {key:'woody',   label:'Woody',   color:'var(--c-woody)'},
  {key:'smokey',  label:'Smokey',  color:'var(--c-smokey)'},
  {key:'sulfury', label:'Sulfury', color:'var(--c-sulfury)'},
  {key:'cereal',  label:'Cereal',  color:'var(--c-cereal)'},
];

/* ページ生成 */
function render(){
  const data = JSON.parse(localStorage.getItem("aromaStamps") || "{}");
  const container = document.getElementById("container");
  container.innerHTML = "";
  categories.forEach(cat=>{
    const list = data[cat.key] || [];
    const block = document.createElement("div");
    block.className="block";
    block.innerHTML = `<h2><span style="background:${cat.color}"></span>${cat.label}</h2>`;
    const tagArea=document.createElement("div");
    tagArea.className="tags";
    if(list.length){
      list.forEach(n=>{
        const tag=document.createElement("div");
        tag.className="tag";
        tag.textContent=n;
        tag.onclick=()=>location.href=`${cat.key}.html`; // ← タップでカテゴリへ戻る
        tagArea.appendChild(tag);
      });
    }else{
      tagArea.innerHTML=`<p style="opacity:.6;font-size:13px;">まだ選択なし</p>`;
    }
    block.appendChild(tagArea);
    container.appendChild(block);
  });
}

/* 全削除 */
function clearAll(){
  if(confirm("本当に全てのスタンプを消しますか？")){
    localStorage.removeItem("aromaStamps");
    render();
  }
}

/* 初期化 */
window.addEventListener('load',render);
</script>
</body>
</html>
