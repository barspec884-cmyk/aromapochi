<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aroma Stamp Board — Amber Palette</title>
<style>
:root{
  --bg:#0f0e0d;
  --panel:#1b1917;
  --accent:#c7a97a;
  --ink:#f6f1e9;
  --warn:#c74a4a;
}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans JP','Meiryo',sans-serif;
  margin:0;
  padding:20px;
}
header{text-align:center;margin-bottom:20px;}
h1{font-size:clamp(20px,6vw,28px);color:var(--accent);margin:0 0 10px;}
.lang-toggle{
  display:inline-flex;
  border:1px solid var(--accent);
  border-radius:20px;
  overflow:hidden;
}
.lang-toggle button{
  background:none;
  border:none;
  color:var(--accent);
  padding:6px 14px;
  cursor:pointer;
  font-size:14px;
}
.lang-toggle button.active{
  background:var(--accent);
  color:var(--bg);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.category{
  border:1px solid #3a2e2e;
  border-radius:12px;
  padding:10px;
  background:var(--panel);
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease;
  position:relative;
}
.category:hover{
  transform:translateY(-3px);
  box-shadow:0 0 10px rgba(199,169,122,.3);
}
.category h2{
  font-size:15px;
  margin-top:0;
  color:var(--accent);
  border-bottom:1px solid #333;
  padding-bottom:4px;
}
.count{
  position:absolute;
  top:8px;
  right:12px;
  font-size:12px;
  color:#f0c96a;
}
.tag{
  display:inline-block;
  background:var(--accent);
  color:var(--bg);
  padding:3px 8px;
  border-radius:12px;
  margin:3px;
  font-size:12px;
}
button.action{
  display:block;
  margin:20px auto 10px;
  border:none;
  border-radius:24px;
  padding:10px 22px;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
  transition:background .2s,transform .1s;
}
button.clear{background:var(--warn);color:#fff;}
button.clear:hover{background:#e45a5a;}
button.home{background:var(--accent);color:#000;}
button.home:hover{background:#d6b982;}
@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>
<header>
  <h1 id="title">Aroma Stamp Board</h1>
  <div class="lang-toggle">
    <button id="jpBtn" class="active">JP</button>
    <button id="enBtn">EN</button>
  </div>
</header>

<div class="grid" id="board"></div>

<!-- 🔸 ボタン群 -->
<button class="action clear" onclick="clearAll()">🗑 全て消去 / Clear All</button>
<button class="action home" onclick="goHome()">🏠 Index に戻る / Back to Index</button>
<button class="action home" onclick="goBalance()">📊 Aroma Balanceへ送る / To Aroma Balance</button>

<script>
const categoriesJP = {
  fruity: "フルーティー",
  floral: "フローラル",
  sweet: "スイート",
  winey: "ワイニー",
  woody: "ウッディー",
  smokey: "スモーキー",
  sulfury: "サルファリー",
  cereal: "シリアル"
};
const categoriesEN = {
  fruity: "Fruity",
  floral: "Floral",
  sweet: "Sweet",
  winey: "Winey",
  woody: "Woody",
  smokey: "Smokey",
  sulfury: "Sulfury",
  cereal: "Cereal"
};

let currentLang = 'jp';
const board = document.getElementById('board');
const jpBtn = document.getElementById('jpBtn');
const enBtn = document.getElementById('enBtn');

function render(){
  board.innerHTML = '';
  const data = JSON.parse(localStorage.getItem('aromaStamps') || '{}');
  const cat = currentLang==='jp' ? categoriesJP : categoriesEN;

  for(const key in cat){
    const box = document.createElement('div');
    box.className = 'category';
    box.onclick = ()=>window.open(key+'.html','aroma_'+key);

    const title = document.createElement('h2');
    title.textContent = cat[key];

    const count = document.createElement('div');
    count.className = 'count';
    const countNum = data[key]?.length || 0;
    count.textContent = countNum + (currentLang==='jp' ? ' 個' : ' items');

    box.appendChild(title);
    box.appendChild(count);

    if(data[key]?.length){
      data[key].forEach(tag=>{
        const el = document.createElement('span');
        el.className = 'tag';
        el.textContent = tag;
        box.appendChild(el);
      });
    }
    board.appendChild(box);
  }
}

function clearAll(){
  const msg = currentLang==='jp' ? '全てのスタンプを削除しますか？' : 'Delete all aroma stamps?';
  if(confirm(msg)){
    localStorage.removeItem('aromaStamps');
    render();
  }
}
function goHome(){window.location.href='index.html';}
function goBalance(){
  const data = JSON.parse(localStorage.getItem('aromaStamps') || '{}');
  if(Object.keys(data).length === 0){
    alert('まだスタンプがありません。先にフレーバーを選択してください。');
  }else{
    window.location.href = 'aromabalance.html';
  }
}

jpBtn.onclick = ()=>{currentLang='jp';jpBtn.classList.add('active');enBtn.classList.remove('active');render();};
enBtn.onclick = ()=>{currentLang='en';enBtn.classList.add('active');jpBtn.classList.remove('active');render();};

render();
</script>
</body>
</html>
